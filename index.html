<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Mind Games — BGM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #020c1b 0%, #0a1f3d 40%, #0d2d5a 70%, #071628 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow-y: auto;
      position: relative;
    }

    /* Estrellas */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 45%, rgba(255,255,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, #ffd700, #c9a96e, transparent);
      opacity: 0.6;
      z-index: 0;
    }

    .bottom-line {
      position: fixed;
      bottom: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, #ffd700, #c9a96e, transparent);
      opacity: 0.3;
      z-index: 10;
    }

    /* ── WRAPPER ── */
    .page {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 80px;
      width: 100%;
    }

    /* ── HEADER ── */
    .logo {
      width: 100px;
      filter: drop-shadow(0 0 30px rgba(201,169,110,0.5));
      animation: glow 3s ease-in-out infinite alternate;
      margin-bottom: 12px;
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 20px rgba(201,169,110,0.3)); }
      to   { filter: drop-shadow(0 0 50px rgba(201,169,110,0.8)); }
    }
    .gold-line {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 12px auto;
    }
    .cards-row {
      display: flex; gap: 10px;
      font-size: 2rem;
      margin: 6px 0 14px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }
    .card-suit { animation: flip 8s linear infinite; display: inline-block; }
    .card-suit:nth-child(2) { animation-delay:-2s; }
    .card-suit:nth-child(3) { animation-delay:-4s; }
    .card-suit:nth-child(4) { animation-delay:-6s; }
    @keyframes flip {
      0%,80%,100% { transform: rotateY(0); }
      40%         { transform: rotateY(180deg); }
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 4.5vw, 2.8rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    h1 span { color: #c9a96e; }
    .subtitle {
      font-size: clamp(0.58rem, 1.3vw, 0.72rem);
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* ── STEPS ── */
    .steps-indicator {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 28px 0 0;
    }
    .step-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0;
      transition: all 0.4s;
    }
    .step-dot.active {
      border-color: #c9a96e;
      color: #c9a96e;
      box-shadow: 0 0 12px rgba(201,169,110,0.35);
    }
    .step-dot.done {
      background: rgba(201,169,110,0.2);
      border-color: #c9a96e;
      color: #c9a96e;
    }
    .step-line {
      width: 36px; height: 1px;
      background: rgba(201,169,110,0.2);
      transition: background 0.4s;
    }
    .step-line.done { background: rgba(201,169,110,0.6); }

    /* ── PANEL GENÉRICO ── */
    .panel {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.45s ease forwards;
    }
    .panel.active { display: flex; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-question {
      font-size: clamp(0.75rem, 1.6vw, 0.88rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 28px 0 20px;
      font-weight: 300;
      text-align: center;
    }

    /* ── OPCIONES ── */
    .options { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    .opt-btn {
      display: flex; align-items: center; gap: 16px;
      background: rgba(201,169,110,0.05);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 4px;
      padding: 14px 20px;
      cursor: pointer;
      text-align: left;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      width: 100%;
      transition: all 0.28s ease;
    }
    .opt-btn:hover {
      background: rgba(201,169,110,0.12);
      border-color: #c9a96e;
      transform: translateX(5px);
    }
    .opt-btn.sel {
      background: rgba(201,169,110,0.18);
      border-color: #ffd700;
      box-shadow: 0 0 14px rgba(201,169,110,0.15);
    }
    .opt-icon { font-size: 1.5rem; min-width: 34px; text-align: center; }
    .opt-texts { display: flex; flex-direction: column; gap: 2px; }
    .opt-title { font-size: 0.88rem; font-weight: 500; letter-spacing: 0.06em; color: #c9a96e; }
    .opt-desc  { font-size: 0.7rem; color: rgba(255,255,255,0.4); letter-spacing: 0.04em; font-weight: 300; }

    /* Grid 2 col (niveles, juegos) */
    .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .opts-grid .opt-btn { flex-direction: column; align-items: flex-start; gap: 6px; }
    @media (max-width: 400px) { .opts-grid { grid-template-columns: 1fr; } }

    /* Tag de materia libre */
    .input-wrap {
      width: 100%;
      position: relative;
      margin-top: 4px;
    }
    .free-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,169,110,0.3);
      border-radius: 4px;
      padding: 13px 18px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .free-input:focus { border-color: #c9a96e; }
    .free-input::placeholder { color: rgba(255,255,255,0.22); }

    /* Sugerencias */
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      width: 100%;
      margin-top: 12px;
    }
    .chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Montserrat', sans-serif;
    }
    .chip:hover, .chip.sel {
      border-color: #c9a96e;
      color: #c9a96e;
      background: rgba(201,169,110,0.1);
    }
    .chips-label {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      width: 100%;
      margin-top: 14px;
    }

    /* ── FAST TRACK ── */
    .fast-track {
      width: 100%;
      max-width: 520px;
      margin-top: 32px;
      border: 1px solid rgba(201,169,110,0.15);
      border-radius: 6px;
      overflow: hidden;
    }
    .fast-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      background: rgba(201,169,110,0.04);
      transition: background 0.2s;
      border: none;
      width: 100%;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
    }
    .fast-header:hover { background: rgba(201,169,110,0.1); }
    .fast-icon { font-size: 1.2rem; }
    .fast-texts { text-align: left; }
    .fast-title { font-size: 0.82rem; font-weight: 500; color: #c9a96e; letter-spacing: 0.1em; }
    .fast-sub   { font-size: 0.67rem; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; margin-top: 2px; }
    .fast-arrow {
      margin-left: auto;
      color: rgba(201,169,110,0.5);
      font-size: 0.8rem;
      transition: transform 0.3s;
    }
    .fast-arrow.open { transform: rotate(180deg); }

    .fast-body {
      display: none;
      padding: 20px;
      border-top: 1px solid rgba(201,169,110,0.1);
      flex-direction: column;
      gap: 12px;
    }
    .fast-body.open { display: flex; animation: fadeUp 0.3s ease; }

    .reg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .reg-row { grid-template-columns: 1fr; } }

    .reg-group { display: flex; flex-direction: column; gap: 5px; }
    .reg-group.full { grid-column: 1/-1; }
    .reg-label {
      font-size: 0.65rem; letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    .reg-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 4px;
      padding: 11px 14px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.25s;
    }
    .reg-input:focus { border-color: #c9a96e; }
    .reg-input::placeholder { color: rgba(255,255,255,0.2); }

    .contact-toggle {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .toggle-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.2s;
    }
    .toggle-btn.sel {
      border-color: #c9a96e;
      color: #c9a96e;
      background: rgba(201,169,110,0.1);
    }

    /* ── BOTÓN CONTINUAR ── */
    .btn-continue {
      display: none;
      margin-top: 24px;
      background: linear-gradient(135deg, rgba(201,169,110,0.18), rgba(201,169,110,0.08));
      border: 1px solid #c9a96e;
      border-radius: 4px;
      padding: 13px 42px;
      color: #c9a96e;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-continue.show { display: inline-block; animation: fadeUp 0.35s ease; }
    .btn-continue:hover {
      background: rgba(201,169,110,0.28);
      box-shadow: 0 0 22px rgba(201,169,110,0.25);
    }

    .lang-note {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* ── SUCCESS ── */
    #panel-success {
      text-align: center;
    }
    .success-icon { font-size: 3rem; margin-bottom: 16px; }
    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: #c9a96e;
      margin-bottom: 8px;
    }
    .success-sub {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
<div class="bottom-line"></div>

<div class="page">

  <!-- HEADER -->
  <img src="logo.png" class="logo" alt="BGM">
  <div class="gold-line"></div>
  <div class="cards-row">
    <span class="card-suit">♠</span>
    <span class="card-suit">♥</span>
    <span class="card-suit">♦</span>
    <span class="card-suit">♣</span>
  </div>
  <h1>Bridge Mind <span>Games</span></h1>
  <p class="subtitle" id="txt-subtitle">Academia Universal · BGM</p>
  <div class="gold-line"></div>

  <!-- INDICADOR DE PASOS -->
  <div class="steps-indicator" id="steps-indicator">
    <div class="step-dot active" id="dot-1">1</div>
    <div class="step-line" id="line-1"></div>
    <div class="step-dot" id="dot-2">2</div>
    <div class="step-line" id="line-2"></div>
    <div class="step-dot" id="dot-3">3</div>
    <div class="step-line" id="line-3"></div>
    <div class="step-dot" id="dot-4">4</div>
  </div>

  <!-- ═══ PANEL 1 — QUÉ QUIERES APRENDER ═══ -->
  <div class="panel active" id="panel-1">
    <p class="panel-question" id="txt-q1">¿Qué quieres aprender?</p>

    <div class="input-wrap">
      <input type="text" class="free-input" id="materia-input"
        placeholder="Escribe una materia, habilidad, idioma..."
        oninput="onMateriaInput(this.value)">
    </div>

    <p class="chips-label" id="txt-suggestions">Sugerencias</p>
    <div class="chips" id="chips-materias"></div>

    <button class="btn-continue" id="btn-1" onclick="goStep(2)">
      Continuar →
    </button>
  </div>

  <!-- ═══ PANEL 2 — MODALIDAD ═══ -->
  <div class="panel" id="panel-2">
    <p class="panel-question" id="txt-q2">¿Cómo quieres aprender?</p>
    <div class="options" id="opts-modalidad">

      <button class="opt-btn" data-val="tradicional" onclick="selectModalidad(this)">
        <span class="opt-icon">📚</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-m1">Tradicional</span>
          <span class="opt-desc" id="txt-m1d">Clases estructuradas, currículo clásico</span>
        </div>
      </button>

      <button class="opt-btn" data-val="juegos-ia" onclick="selectModalidad(this)">
        <span class="opt-icon">🎮</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-m2">Juegos + IA constante</span>
          <span class="opt-desc" id="txt-m2d">Aprende jugando con agentes IA en todo momento</span>
        </div>
      </button>

      <button class="opt-btn" data-val="profesores" onclick="selectModalidad(this)">
        <span class="opt-icon">👨‍🏫</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-m3">Con profesores de prestigio</span>
          <span class="opt-desc" id="txt-m3d">Docentes internacionales especializados</span>
        </div>
      </button>

      <button class="opt-btn" data-val="combinado" onclick="selectModalidad(this)">
        <span class="opt-icon">🔀</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-m4">Todo combinado</span>
          <span class="opt-desc" id="txt-m4d">Juegos + IA + profesores según lo necesite</span>
        </div>
      </button>

    </div>
    <button class="btn-continue" id="btn-2" onclick="goStep(3)">Continuar →</button>
  </div>

  <!-- ═══ PANEL 3 — JUEGO ═══ -->
  <div class="panel" id="panel-3">
    <p class="panel-question" id="txt-q3">¿A través de qué juego?</p>
    <div class="opts-grid" id="opts-juegos">

      <button class="opt-btn" data-val="bridge" onclick="selectJuego(this)">
        <span class="opt-icon">🃏</span>
        <div class="opt-texts">
          <span class="opt-title">Bridge</span>
          <span class="opt-desc" id="txt-j1d">Estrategia, lógica y comunicación</span>
        </div>
      </button>

      <button class="opt-btn" data-val="ajedrez" onclick="selectJuego(this)">
        <span class="opt-icon">♟️</span>
        <div class="opt-texts">
          <span class="opt-title">Ajedrez</span>
          <span class="opt-desc" id="txt-j2d">Pensamiento crítico y planificación</span>
        </div>
      </button>

      <button class="opt-btn" data-val="poker" onclick="selectJuego(this)">
        <span class="opt-icon">🎰</span>
        <div class="opt-texts">
          <span class="opt-title">Poker</span>
          <span class="opt-desc" id="txt-j3d">Probabilidad, psicología y decisión</span>
        </div>
      </button>

      <button class="opt-btn" data-val="otro" onclick="selectJuego(this)">
        <span class="opt-icon">✨</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-j4">Otro / Se crea</span>
          <span class="opt-desc" id="txt-j4d">Proponemos el juego ideal o lo creamos</span>
        </div>
      </button>

      <button class="opt-btn" data-val="nosé" onclick="selectJuego(this)" style="grid-column:1/-1">
        <span class="opt-icon">🤔</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-j5">No sé aún</span>
          <span class="opt-desc" id="txt-j5d">BGM te recomienda el juego según tu materia</span>
        </div>
      </button>

    </div>

    <!-- Campo si elige "otro" -->
    <div id="juego-otro-wrap" style="display:none; width:100%; margin-top:12px;">
      <input type="text" class="free-input" id="juego-otro-input"
        placeholder="Describe el juego que imaginas..."
        oninput="onJuegoOtroInput(this.value)">
    </div>

    <button class="btn-continue" id="btn-3" onclick="goStep(4)">Continuar →</button>
  </div>

  <!-- ═══ PANEL 4 — NIVEL ═══ -->
  <div class="panel" id="panel-4">
    <p class="panel-question" id="txt-q4">¿Cuál es tu nivel actual?</p>
    <div class="opts-grid" id="opts-nivel">

      <button class="opt-btn" data-val="cero" onclick="selectNivel(this)">
        <span class="opt-icon">🌱</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n1">Desde cero</span>
          <span class="opt-desc" id="txt-n1d">No tengo ningún conocimiento previo</span>
        </div>
      </button>

      <button class="opt-btn" data-val="basico" onclick="selectNivel(this)">
        <span class="opt-icon">📗</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n2">Básico</span>
          <span class="opt-desc" id="txt-n2d">Conozco lo fundamental</span>
        </div>
      </button>

      <button class="opt-btn" data-val="intermedio" onclick="selectNivel(this)">
        <span class="opt-icon">📈</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n3">Intermedio</span>
          <span class="opt-desc" id="txt-n3d">Tengo buenas bases</span>
        </div>
      </button>

      <button class="opt-btn" data-val="avanzado" onclick="selectNivel(this)">
        <span class="opt-icon">⭐</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n4">Avanzado</span>
          <span class="opt-desc" id="txt-n4d">Domino bien el tema</span>
        </div>
      </button>

      <button class="opt-btn" data-val="experto" onclick="selectNivel(this)">
        <span class="opt-icon">🏆</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n5">Experto</span>
          <span class="opt-desc" id="txt-n5d">Nivel profesional o de enseñanza</span>
        </div>
      </button>

      <button class="opt-btn" data-val="evaluar" onclick="selectNivel(this)">
        <span class="opt-icon">🔍</span>
        <div class="opt-texts">
          <span class="opt-title" id="txt-n6">Evalúame</span>
          <span class="opt-desc" id="txt-n6d">No sé mi nivel, quiero un diagnóstico</span>
        </div>
      </button>

    </div>
    <button class="btn-continue" id="btn-4" onclick="finalizar()">Ir a BGM →</button>
  </div>

  <!-- ═══ PANEL SUCCESS ═══ -->
  <div class="panel" id="panel-success">
    <div class="success-icon">✦</div>
    <h2 class="success-title" id="txt-success-title">Bienvenido a BGM</h2>
    <p class="success-sub" id="txt-success-sub">Preparando tu experiencia personalizada...</p>
    <div class="gold-line"></div>
  </div>

  <!-- ═══ FAST TRACK — REGISTRO RÁPIDO ═══ -->
  <div class="fast-track" id="fast-track">
    <button class="fast-header" onclick="toggleFast()">

    n5:'विशेषज्ञ', n5d:'पेशेवर या शिक्षण स्तर',
    n6:'मेरा मूल्यांकन करें', n6d:'मुझे अपना स्तर नहीं पता',
    successTitle:'BGM में आपका स्वागत है',
    successSub:'आपका व्यक्तिगत अनुभव तैयार हो रहा है...',
    ftTitle:'पंजीकरण करें और सीधे प्रवेश करें',
    ftSub:'प्रक्रिया छोड़ें · बाद में व्यक्तिगतकरण',
    ftName:'नाम', ftEmail:'ईमेल',
    ftContact:'पसंदीदा संपर्क माध्यम',
    ftContactVal:'नंबर या उपयोगकर्ता नाम',
    langNote:'भाषा स्वचालित रूप से पहचानी गई',
    materiaPlaceholder:'विषय, कौशल, भाषा लिखें...',
    juegoOtroPlaceholder:'अपने कल्पित खेल का वर्णन करें...',
  }
};

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let currentLang = 'es';
let state = { materia:'', modalidad:'', juego:'', nivel:'', juegoOtro:'' };
let contactType = 'telefono';

// ═══════════════════════════════════════
// DETECTAR IDIOMA
// ═══════════════════════════════════════
const langMap = { es:'es', en:'en', fr:'fr', de:'de', it:'it', pt:'pt', ja:'ja', ar:'ar', zh:'zh', hi:'hi' };
const nav = navigator.language || navigator.userLanguage || 'en';
currentLang = langMap[nav.substring(0,2)] || 'en';
applyLang(currentLang);

function applyLang(lang) {
  currentLang = lang;
  const t = TR[lang] || TR.en;

  document.getElementById('txt-subtitle').textContent = t.subtitle;
  document.getElementById('txt-q1').textContent = t.q1;
  document.getElementById('txt-q2').textContent = t.q2;
  document.getElementById('txt-q3').textContent = t.q3;
  document.getElementById('txt-q4').textContent = t.q4;
  document.getElementById('txt-suggestions').textContent = t.suggestions;
  document.getElementById('txt-m1').textContent = t.m1;
  document.getElementById('txt-m1d').textContent = t.m1d;
  document.getElementById('txt-m2').textContent = t.m2;
  document.getElementById('txt-m2d').textContent = t.m2d;
  document.getElementById('txt-m3').textContent = t.m3;
  document.getElementById('txt-m3d').textContent = t.m3d;
  document.getElementById('txt-m4').textContent = t.m4;
  document.getElementById('txt-m4d').textContent = t.m4d;
  document.getElementById('txt-j1d').textContent = t.j1d;
  document.getElementById('txt-j2d').textContent = t.j2d;
  document.getElementById('txt-j3d').textContent = t.j3d;
  document.getElementById('txt-j4').textContent = t.j4;
  document.getElementById('txt-j4d').textContent = t.j4d;
  document.getElementById('txt-j5').textContent = t.j5;
  document.getElementById('txt-j5d').textContent = t.j5d;
  document.getElementById('txt-n1').textContent = t.n1;
  document.getElementById('txt-n1d').textContent = t.n1d;
  document.getElementById('txt-n2').textContent = t.n2;
  document.getElementById('txt-n2d').textContent = t.n2d;
  document.getElementById('txt-n3').textContent = t.n3;
  document.getElementById('txt-n3d').textContent = t.n3d;
  document.getElementById('txt-n4').textContent = t.n4;
  document.getElementById('txt-n4d').textContent = t.n4d;
  document.getElementById('txt-n5').textContent = t.n5;
  document.getElementById('txt-n5d').textContent = t.n5d;
  document.getElementById('txt-n6').textContent = t.n6;
  document.getElementById('txt-n6d').textContent = t.n6d;
  document.getElementById('txt-success-title').textContent = t.successTitle;
  document.getElementById('txt-success-sub').textContent = t.successSub;
  document.getElementById('txt-ft-title').textContent = t.ftTitle;
  document.getElementById('txt-ft-sub').textContent = t.ftSub;
  document.getElementById('txt-ft-name').textContent = t.ftName;
  document.getElementById('txt-ft-email').textContent = t.ftEmail;
  document.getElementById('txt-ft-contact').textContent = t.ftContact;
  document.getElementById('txt-ft-contactval').textContent = t.ftContactVal;
  document.getElementById('txt-lang-note').textContent = t.langNote;
  document.getElementById('materia-input').placeholder = t.materiaPlaceholder;
  document.getElementById('juego-otro-input').placeholder = t.juegoOtroPlaceholder;
  document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';

  // Chips de materias
  buildChips(t.materias);
}

// ═══════════════════════════════════════
// CHIPS DE MATERIAS
// ═══════════════════════════════════════
function buildChips(materias) {
  const wrap = document.getElementById('chips-materias');
  wrap.innerHTML = '';
  materias.forEach(m => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = m;
    c.onclick = () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('sel'));
      c.classList.add('sel');
      document.getElementById('materia-input').value = m;
      state.materia = m;
      document.getElementById('btn-1').classList.add('show');
    };
    wrap.appendChild(c);
  });
}

// ═══════════════════════════════════════
// PANEL 1 — MATERIA
// ═══════════════════════════════════════
function onMateriaInput(val) {
  state.materia = val.trim();
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('sel'));
  document.getElementById('btn-1').classList.toggle('show', val.trim().length > 1);
}

// ═══════════════════════════════════════
// PANEL 2 — MODALIDAD
// ═══════════════════════════════════════
function selectModalidad(btn) {
  document.querySelectorAll('#opts-modalidad .opt-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  state.modalidad = btn.dataset.val;
  document.getElementById('btn-2').classList.add('show');
}

// ═══════════════════════════════════════
// PANEL 3 — JUEGO
// ═══════════════════════════════════════
function selectJuego(btn) {
  document.querySelectorAll('#opts-juegos .opt-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  state.juego = btn.dataset.val;
  const otroWrap = document.getElementById('juego-otro-wrap');
  if (state.juego === 'otro') {
    otroWrap.style.display = 'block';
    document.getElementById('btn-3').classList.remove('show');
  } else {
    otroWrap.style.display = 'none';
    document.getElementById('btn-3').classList.add('show');
  }
}

function onJuegoOtroInput(val) {
  state.juegoOtro = val.trim();
  document.getElementById('btn-3').classList.toggle('show', val.trim().length > 2);
}

// ═══════════════════════════════════════
// PANEL 4 — NIVEL
// ═══════════════════════════════════════
function selectNivel(btn) {
  document.querySelectorAll('#opts-nivel .opt-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  state.nivel = btn.dataset.val;
  document.getElementById('btn-4').classList.add('show');
}

// ═══════════════════════════════════════
// NAVEGACIÓN DE PASOS
// ═══════════════════════════════════════
let currentStep = 1;

function goStep(n) {
  // Desactivar panel actual
  document.getElementById('panel-' + currentStep).classList.remove('active');
  // Marcar dot actual como done
  document.getElementById('dot-' + currentStep).classList.remove('active');
  document.getElementById('dot-' + currentStep).classList.add('done');
  if (currentStep < 4) {
    document.getElementById('line-' + currentStep).classList.add('done');
  }
  // Activar nuevo panel
  currentStep = n;
  document.getElementById('panel-' + n).classList.add('active');
  document.getElementById('dot-' + n).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finalizar() {
  // Registrar
  saveData({
    tipo: 'flujo_completo',
    materia: state.materia,
    modalidad: state.modalidad,
    juego: state.juego,
    juegoOtro: state.juegoOtro,
    nivel: state.nivel,
    lang: currentLang,
    fast: false
  });

  // Mostrar success
  document.getElementById('panel-4').classList.remove('active');
  document.getElementById('dot-4').classList.remove('active');
  document.getElementById('dot-4').classList.add('done');
  document.getElementById('steps-indicator').style.display = 'none';
  document.getElementById('fast-track').style.display = 'none';
  document.getElementById('panel-success').classList.add('active');

  // Ir a index después de 2s
  setTimeout(() => {
    const params = new URLSearchParams({
      materia: state.materia,
      modalidad: state.modalidad,
      juego: state.juego !== 'otro' ? state.juego : state.juegoOtro,
      nivel: state.nivel,
      lang: currentLang,
      evaluar: state.nivel === 'evaluar' ? '1' : '0'
    });
    window.location.href = 'index.html?' + params.toString();
  }, 2200);
}

// ═══════════════════════════════════════
// FAST TRACK
// ═══════════════════════════════════════
function toggleFast() {
  const body = document.getElementById('fast-body');
  const arrow = document.getElementById('fast-arrow');
  const open = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

function toggleContact(btn) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  contactType = btn.dataset.ct;
}

function fastRegister() {
  const name  = document.getElementById('ft-name').value.trim();
  const email = document.getElementById('ft-email').value.trim();
  const contact = document.getElementById('ft-contact').value.trim();

  if (!name || !email) {
    document.getElementById('ft-name').style.borderColor = !name ? '#ff2d6b' : '';
    document.getElementById('ft-email').style.borderColor = !email ? '#ff2d6b' : '';
    return;
  }

  saveData({
    tipo: 'fast_track',
    nombre: name,
    email: email,
    contactType: contactType,
    contact: contact,
    lang: currentLang,
    fast: true
  });

  // Mostrar success
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('steps-indicator').style.display = 'none';
  document.getElementById('fast-track').style.display = 'none';
  document.getElementById('panel-success').classList.add('active');

  setTimeout(() => {
    window.location.href = 'index.html?fast=1&lang=' + currentLang;
  }, 2000);
}

// ═══════════════════════════════════════
// GUARDAR DATOS
// ═══════════════════════════════════════
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzEDDFBgsQcEMSSjfwNTPrWkPdcYmV9IBSDr7ysvfNdCA4tV14ItzuK0G6glm0N1bqyww/exec";

function saveData(obj) {
  // sessionStorage para index.html
  sessionStorage.setItem('bgm_data', JSON.stringify(obj));
  // localStorage backup
  const all = JSON.parse(localStorage.getItem('bgm_leads') || '[]');
  all.push({ ...obj, date: new Date().toISOString(), ua: navigator.userAgent });
  localStorage.setItem('bgm_leads', JSON.stringify(all));
  // Google Sheets (silencioso)
  const fd = new FormData();
  Object.entries({ ...obj, fecha: new Date().toISOString(), ua: navigator.userAgent })
    .forEach(([k,v]) => fd.append(k, v));
  fetch(SHEET_URL, { method:'POST', body:fd, mode:'no-cors' }).catch(()=>{});
}

// Registrar visita inicial
setTimeout(() => saveData({ tipo:'visita_welcome', lang:currentLang }), 2500);
</script>
