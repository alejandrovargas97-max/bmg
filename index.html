<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgeMindGames BGM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0056b3; color: white; margin: 0; text-align: center; }
        header { padding: 20px; }
        .logo-bgm { max-width: 150px; }
        .globo { font-size: 60px; display: block; margin: 15px auto; animation: spin 3s linear infinite; }
        #my-photo { width: 180px; height: 180px; border-radius: 50%; border: 4px solid white; display: none; margin: 15px auto; object-fit: cover; }
        
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .nav-flags { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 20px; }
        .f-btn { 
            background: white; border: none; padding: 8px 15px; border-radius: 20px; 
            cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold;
            opacity: 0; transform: translateY(10px); transition: 0.4s;
        }
        .f-btn.show { opacity: 1; transform: translateY(0); }

        video { width: 90%; max-width: 700px; border-radius: 15px; border: 3px solid white; margin-bottom: 20px; }
        
        .gallery { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding-bottom: 40px; }
        .gallery img { width: 200px; height: 140px; object-fit: cover; border-radius: 10px; border: 2px solid white; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" class="logo-bgm">
        <span id="globo-icon" class="globo">🌐</span>
        <img id="my-photo" src="esp.jpg">
    </header>

    <nav class="nav-flags" id="flag-container"></nav>

    <video controls><source src="esp.mp4" type="video/mp4"></video>

    <div class="gallery">
        <img src="esp.jpg"> <img src="ico.jpg"> <img src="inbg.jpg"> <img id="foto-4" src="esbr.jpg"> </div>

    <script>
        const flags = [
            {n:'ES', c:'es', img:'esbr.jpg'}, {n:'EN', c:'us', img:'enbr.jpg'}, {n:'DE', c:'de', img:'enbr.jpg'},
            {n:'IT', c:'it', img:'itabr.jpg'}, {n:'FR', c:'fr', img:'enbr.jpg'}, {n:'JP', c:'jp', img:'jpnbr.jpg'},
            {n:'AR', c:'ae', img:'dubr.jpg'}, {n:'ZH', c:'cn', img:'dubr.jpg'}, {n:'PT', c:'pt', img:'dubr.jpg'},
            {n:'IN', c:'in', img:'inbg.jpg'}
        ];

        window.onload = () => {
            // Secuencia inicial
            setTimeout(() => {
                document.getElementById('globo-icon').style.display = 'none';
                document.getElementById('my-photo').style.display = 'block';
            }, 3000);

            // Banderas con escala musical
            const container = document.getElementById('flag-container');
            flags.forEach((f, i) => {
                let btn = document.createElement('button');
                btn.className = 'f-btn';
                btn.innerHTML = `<span class="flag-icon flag-icon-${f.c}"></span> ${f.n}`;
                
                btn.onclick = () => {
                    document.getElementById('foto-4').src = f.img; // Solo toca la foto 4
                };

                container.appendChild(btn);
                setTimeout(() => { 
                    btn.classList.add('show');
                    new Audio(`audio/note${i+1}.mp3`).play().catch(()=>{}); 
                }, i * 200);
            });
        };
    </script>
</body>
</html>
